<!DOCTYPE html>
<html lang="yi" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JEM Yiddish ASR Workbench</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="app-header">
    <h1 class="app-title" id="app-title">ASR Workbench</h1>
    <select id="library-selector" class="library-selector" title="Active library" style="display:none"></select>
    <div class="toolbar">
      <a id="btn-admin" class="toolbar-btn" href="/admin.html" style="display:none;text-decoration:none;">Admin</a>
      <button id="btn-search-transcripts" class="toolbar-btn" title="Search through all transcript text">Search Transcripts</button>
      <button id="btn-asr-settings" class="toolbar-btn" title="Configure ASR providers">ASR Settings</button>
      <button id="btn-export-csv" class="toolbar-btn" title="Export Approved as CSV">Export CSV</button>
      <button id="btn-logout" class="toolbar-btn" title="Sign out">Sign Out</button>
      <button id="btn-toolbar-more" title="More options" aria-label="More toolbar options">&#8943;</button>
    </div>
  </header>

  <div class="tab-bar" id="tab-bar">
    <button class="tab-btn active" data-tab="audio">Audio</button>
    <button class="tab-btn" data-tab="transcripts">Transcripts</button>
  </div>

  <button id="btn-filter-toggle" aria-expanded="false" aria-controls="filter-bar">
    <span>&#9776; Filter</span>
    <span class="filter-toggle-active-label" id="filter-toggle-label"></span>
  </button>
  <nav class="filter-bar" id="filter-bar">
    <div class="filter-group" data-tab="audio">
      <span class="filter-group-label">50hr Collection</span>
      <div class="filter-pills">
        <button class="filter-pill active" data-filter="fifty">All <span class="badge" id="count-fifty">0</span></button>
        <button class="filter-pill" data-filter="fifty-unmapped">Unmapped <span class="badge" id="count-fifty-unmapped">0</span></button>
        <button class="filter-pill" data-filter="fifty-mapped">Mapped <span class="badge" id="count-fifty-mapped">0</span></button>
        <button class="filter-pill" data-filter="fifty-cleaned">Cleaned <span class="badge" id="count-fifty-cleaned">0</span></button>
        <button class="filter-pill" data-filter="fifty-aligned">Aligned <span class="badge" id="count-fifty-aligned">0</span></button>
        <button class="filter-pill" data-filter="fifty-approved">Approved <span class="badge" id="count-fifty-approved">0</span></button>
      </div>
    </div>
    <div class="filter-group" data-tab="audio">
      <span class="filter-group-label">Full Archive</span>
      <div class="filter-pills">
        <button class="filter-pill" data-filter="all">All <span class="badge" id="count-all">0</span></button>
        <button class="filter-pill" data-filter="unmapped">Unmapped <span class="badge" id="count-unmapped">0</span></button>
        <button class="filter-pill" data-filter="approved">Approved <span class="badge" id="count-approved">0</span></button>
        <button class="filter-pill" data-filter="benchmark">Benchmark <span class="badge" id="count-benchmark">0</span></button>
        <button class="filter-pill" data-filter="perfect-match">Perfect Match <span class="badge" id="count-perfect-match">0</span></button>
        <button class="filter-pill" data-filter="strong-match">Match 50%+ <span class="badge" id="count-strong-match">0</span></button>
      </div>
    </div>
    <div class="filter-controls">
      <select id="filter-year" class="filter-select"><option value="">All Years</option></select>
      <select id="filter-month" class="filter-select"><option value="">All Months</option></select>
      <select id="filter-type" class="filter-select"><option value="">All Types</option></select>
      <input type="text" id="search-input" class="search-input" placeholder="Search..." />
    </div>
  </nav>

  <main class="table-container" id="table-container">
    <!-- Table rendered by src/table.js -->
  </main>


  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" id="modal">
      <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
      <div class="modal-content" id="modal-content">
        <!-- Search modal, karaoke player, or benchmark config injected here -->
      </div>
    </div>
  </div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
