<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — JEM ASR Workbench</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', 'Segoe UI', sans-serif;
      background: #f2f2f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-wrap {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .login-logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(145deg, #007AFF, #0051d4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0, 122, 255, 0.35);
    }

    .login-logo svg {
      width: 34px;
      height: 34px;
      fill: #fff;
    }

    .login-brand-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: #1c1c1e;
      letter-spacing: -0.3px;
    }

    .login-brand-sub {
      font-size: 0.82rem;
      color: #8e8e93;
      letter-spacing: 0.01em;
    }

    .login-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07), 0 8px 32px rgba(0,0,0,0.07);
      padding: 28px 28px 24px;
      width: 100%;
    }

    .login-card-title {
      font-size: 1rem;
      font-weight: 700;
      color: #1c1c1e;
      letter-spacing: -0.2px;
      margin-bottom: 22px;
      text-align: center;
    }

    .login-field {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin-bottom: 12px;
    }

    .login-field label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #6c6c70;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .login-field input {
      padding: 12px 14px;
      border: 1.5px solid rgba(60, 60, 67, 0.15);
      border-radius: 10px;
      font-size: 1rem;
      color: #1c1c1e;
      background: #fafafa;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      font-family: inherit;
    }

    .login-field input:focus {
      border-color: #007AFF;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.12);
    }

    .login-submit {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      background: #007AFF;
      color: #fff;
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: -0.1px;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .login-submit:hover:not(:disabled) {
      opacity: 0.9;
    }

    .login-submit:active:not(:disabled) {
      transform: scale(0.98);
      opacity: 0.85;
    }

    .login-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .login-error {
      margin-top: 12px;
      font-size: 0.84rem;
      color: #ff3b30;
      text-align: center;
      min-height: 1.2em;
      font-weight: 500;
    }

    .login-footer {
      font-size: 0.78rem;
      color: #aeaeb2;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-brand">
      <div class="login-logo">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
        </svg>
      </div>
      <div>
        <div class="login-brand-name">JEM ASR Workbench</div>
        <div class="login-brand-sub" style="text-align:center">Yiddish Speech Processing</div>
      </div>
    </div>

    <div class="login-card">
      <div class="login-card-title">Sign In</div>
      <form id="login-form">
        <div class="login-field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" autocomplete="email" required placeholder="you@example.com" />
        </div>
        <div class="login-field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" autocomplete="current-password" required placeholder="••••••••" />
        </div>
        <button type="submit" class="login-submit" id="login-submit">Sign In</button>
        <div class="login-error" id="login-error"></div>
      </form>
    </div>

    <div class="login-card" id="set-password-card" style="display:none;">
      <h2 class="login-title">Set Your Password</h2>
      <p style="font-size:0.9rem;color:#666;margin-bottom:16px;">Welcome! Create a password to complete your account setup.</p>
      <form id="set-password-form">
        <div class="login-field">
          <label for="new-password">New Password</label>
          <input type="password" id="new-password" autocomplete="new-password" required minlength="6" placeholder="At least 6 characters" />
        </div>
        <div class="login-field">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" autocomplete="new-password" required minlength="6" placeholder="Re-enter your password" />
        </div>
        <button type="submit" class="login-submit" id="set-password-submit">Set Password & Continue</button>
        <div class="login-error" id="set-password-error"></div>
      </form>
    </div>

    <div class="login-footer">Authorized access only</div>
  </div>

  <script type="module" src="/src/login.js"></script>
</body>
</html>
