<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASR Admin</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('jem-asr-theme-v1');
        if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/src/styles/refresh.css" />
  <link rel="stylesheet" href="/src/styles/app.css" />
</head>
<body>
  <header class="app-header">
    <a href="/" class="app-title" style="text-decoration:none;">ASR Admin</a>
    <div class="toolbar">
      <a href="/" class="toolbar-btn" style="text-decoration:none;">Back to App</a>
      <button id="btn-logout" class="toolbar-btn" title="Sign out">Sign Out</button>
    </div>
  </header>

  <main class="admin-page" id="admin-page">
    <div class="loading-state">Loading…</div>
  </main>

  <script type="module" src="/src/admin.js"></script>
</body>
</html>
