<!DOCTYPE html>
<html lang="yi" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JEM Yiddish ASR Workbench</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="app-header">
    <h1 class="app-title" id="app-title">ASR Workbench</h1>
    <select id="library-selector" class="library-selector" title="Active library" style="display:none"></select>
    <div class="toolbar">
      <a id="btn-admin" class="toolbar-btn" href="/admin.html" style="display:none;text-decoration:none;">Admin</a>
      <button id="btn-search-transcripts" class="toolbar-btn" title="Search through all transcript text">Search Transcripts</button>
      <button id="btn-asr-settings" class="toolbar-btn" title="Configure ASR providers">ASR Settings</button>
      <button id="btn-export-csv" class="toolbar-btn" title="Export Approved as CSV">Export CSV</button>
      <button id="btn-logout" class="toolbar-btn" title="Sign out">Sign Out</button>
      <button id="btn-toolbar-more" title="More options" aria-label="More toolbar options">&#8943;</button>
    </div>
  </header>

  <div class="tab-bar" id="tab-bar">
    <button class="tab-btn active" data-tab="audio">Audio</button>
    <button class="tab-btn" data-tab="transcripts">Transcripts</button>
  </div>

  <button id="btn-filter-toggle" aria-expanded="false" aria-controls="filter-bar">
    <span>&#9776; Filter</span>
    <span class="filter-toggle-active-label" id="filter-toggle-label"></span>
  </button>
  <nav class="filter-bar" id="filter-bar">
    <div class="filter-controls" data-tab="audio">
      <select id="filter-fifty" class="filter-select">
        <option value="">All Files</option>
        <option value="yes">50hr only</option>
        <option value="no">Not in 50hr</option>
      </select>
      <div class="multi-select" id="filter-status">
        <button class="multi-select-btn filter-select" type="button">All Statuses</button>
        <div class="multi-select-dropdown">
          <label><input type="checkbox" value="unmapped"> Unmapped</label>
          <label><input type="checkbox" value="mapped"> Mapped</label>
          <label><input type="checkbox" value="cleaned"> Cleaned</label>
          <label><input type="checkbox" value="aligned"> Aligned</label>
          <label><input type="checkbox" value="approved"> Approved</label>
          <label><input type="checkbox" value="rejected"> Rejected</label>
          <label><input type="checkbox" value="benchmark"> Benchmark</label>
        </div>
      </div>
      <select id="filter-confidence" class="filter-select">
        <option value="">All Confidence</option>
        <option value="perfect">Perfect Match (100%)</option>
        <option value="strong">Match 50%+</option>
        <option value="weak">Match &lt;50%</option>
        <option value="none">No Match</option>
      </select>
    </div>
    <div class="filter-controls">
      <select id="filter-year" class="filter-select"><option value="">All Years</option></select>
      <select id="filter-month" class="filter-select"><option value="">All Months</option></select>
      <select id="filter-type" class="filter-select" data-tab="audio"><option value="">All Types</option></select>
      <input type="text" id="search-input" class="search-input" placeholder="Search..." />
      <button id="btn-reset-filters" class="reset-filters-btn" title="Reset all filters">Reset</button>
      <span id="filter-count" class="filter-count"></span>
    </div>
  </nav>

  <main class="table-container" id="table-container">
    <!-- Table rendered by src/table.js -->
  </main>


  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" id="modal">
      <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
      <div class="modal-content" id="modal-content">
        <!-- Search modal, karaoke player, or benchmark config injected here -->
      </div>
    </div>
  </div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
