name: build-jem-exporter

# Build & push the RunPod serverless dataset-export image whenever its
# Dockerfile, handler, or this workflow changes on main. Mirrors the pattern
# used by the jem-trainer image.

on:
  push:
    branches: [main]
    paths:
      - 'runpod/jem-exporter/**'
      - '.github/workflows/build-jem-exporter.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: latest)'
        required: false
        default: 'latest'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BASE="ghcr.io/${OWNER_LC}/jem-exporter"
          TAG_INPUT="${{ inputs.tag }}"
          TAG="${TAG_INPUT:-latest}"
          SHA_TAG="sha-${GITHUB_SHA::7}"
          {
            echo "image_base=${BASE}"
            echo "tag_primary=${BASE}:${TAG}"
            echo "tag_sha=${BASE}:${SHA_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: runpod/jem-exporter
          file: runpod/jem-exporter/Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.tag_primary }}
            ${{ steps.tags.outputs.tag_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Built jem-exporter image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.tag_primary }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.tag_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Update your RunPod endpoint container image to this digest." >> "$GITHUB_STEP_SUMMARY"
